[package]
name = "filem"
version = "0.1.0"
edition = "2021"
description = "A quiet, keyboard-first file manager for Linux"
license = "MIT"

[dependencies]
gio = "0.18"
qmetaobject = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
notify = "8"
percent-encoding = "2"
regex = "1"
unicode-normalization = "0.1"
libc = "0.2"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["aes-crypto", "deflate"] }
md5 = "0.7"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
